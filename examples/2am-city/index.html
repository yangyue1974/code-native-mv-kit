<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>2AM in Your Car</title>
    <script src="assets/vendor/gsap/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/build/three.module.js",
          "three/addons/": "./assets/vendor/three/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face { font-family: "Big Shoulders Display"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/BigShouldersDisplay-800.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 300; font-display: block; src: url("assets/fonts/IBMPlexMono-300.woff2") format("woff2"); }
      html, body { margin: 0; background: #03040a; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #03040a; }
      .clip { position: absolute; inset: 0; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* warm up both faces so the overlay canvas never draws in a fallback font */
      #font-warm { position: absolute; left: -9999px; top: 0; font: 800 20px "Big Shoulders Display"; }
      #font-warm span { font: 300 20px "IBM Plex Mono"; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="194.04"
      data-width="1920"
      data-height="1080"
    >
      <!-- the city (Three.js) and the lyric/HUD layer (2D canvas), both drawn from HyperFrames time -->
      <canvas id="gl" class="clip layer" width="1920" height="1080" data-start="0" data-duration="194.04" data-track-index="1"></canvas>
      <canvas id="ov" class="clip layer" width="1920" height="1080" data-start="0" data-duration="194.04" data-track-index="2"></canvas>
      <audio id="song" src="assets/audio/track.mp3" data-start="0" data-duration="194.04" data-track-index="0"></audio>
      <div id="font-warm" aria-hidden="true" data-layout-allow-overflow>2AM IN YOUR CAR <span>02:00 AM</span></div>
    </div>

    <script>
      // the picture is driven by the three adapter (hf-seek); this paused timeline is the registry anchor
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script src="assets/song-data.js"></script>
    <script src="assets/overlay.js"></script>
    <script type="module">
      import { createCity3D } from "./assets/city3d.js";

      const W = 1920, H = 1080;
      let draw = null;

      // setup (font load + city build + shader compile) is CPU work the adapter can't see: hold readiness on it
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["city3d"] = (async () => {
        await Promise.all(["800 40px 'Big Shoulders Display'", "300 20px 'IBM Plex Mono'"].map((f) => document.fonts.load(f)));
        const city = createCity3D({ canvas: document.getElementById("gl"), song: window.SONG, width: W, height: H, palette: "blueprint" });
        const overlay = Overlay2D.create({ song: window.SONG, width: W, height: H });
        const octx = document.getElementById("ov").getContext("2d");
        draw = (t) => overlay.draw(octx, t, city.renderAt(t));
        draw(window.__hfThreeTime || 0);
      })();

      window.addEventListener("hf-seek", (e) => { if (draw) draw(e.detail.time); });
    </script>
  </body>
</html>
