<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>案卷 0214 · 预览</title>
<script type="importmap">{ "imports": { "three": "../assets/vendor/three/build/three.module.js", "three/addons/": "../assets/vendor/three/examples/jsm/" } }</script>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  body { margin: 0; background: #0b0b0e; color: #eee; font: 14px "IBM Plex Mono", monospace; }
  .stage { position: relative; width: min(100vw, calc((100vh - 60px) * 16 / 9)); aspect-ratio: 16/9; margin: 0 auto; background: #000; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 12px; }
  button { background: #e2231a; color: #fff; border: 0; border-radius: 99px; padding: 6px 18px; font: inherit; cursor: pointer; }
  input { width: 50vw; accent-color: #e2231a; }
</style></head>
<body>
<div class="stage"><canvas id="gl" width="1920" height="1080"></canvas></div>
<div class="bar"><button id="play">▶ 播放</button><input id="seek" type="range" min="0" max="30" step="0.01" value="0"><span id="clock"></span></div>
<audio id="au" src="../assets/audio/track.mp3" preload="auto"></audio>
<script src="../assets/song-data.js"></script>
<script type="module">
  import { createCaseFile } from "../assets/casefile.js";
  await Promise.all(["400 40px 'Courier Prime'", "700 40px 'Courier Prime'", "400 40px 'Permanent Marker'", "400 40px VT323", "800 40px 'Big Shoulders Display'"].map((f) => document.fonts.load(f)));
  const N = await createCaseFile({ canvas: document.getElementById("gl"), song: SONG, base: "../assets" });
  const au = document.getElementById("au"), seek = document.getElementById("seek");
  window.N = N; window.scrubV = 0;
  const OFF = N.SONG_OFFSET;
  function frame() {
    let v = au.paused ? window.scrubV : au.currentTime - OFF;
    if (!au.paused && v >= 30) { au.currentTime = OFF; v = 0; }
    N.render(Math.max(0, v));
    document.getElementById("clock").textContent = v.toFixed(2);
    if (!au.paused) seek.value = v;
    requestAnimationFrame(frame);
  }
  document.getElementById("play").onclick = () => { if (au.paused) { const v = au.currentTime - OFF; if (v < 0 || v > 30) au.currentTime = OFF; au.play(); } else { au.pause(); window.scrubV = au.currentTime - OFF; } };
  au.onplay = au.onpause = () => (document.getElementById("play").textContent = au.paused ? "▶ 播放" : "❚❚ 暂停");
  seek.oninput = (e) => { window.scrubV = +e.target.value; au.currentTime = OFF + window.scrubV; };
  requestAnimationFrame(frame);
</script></body></html>
