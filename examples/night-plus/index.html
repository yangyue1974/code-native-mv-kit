<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NIGHT+ · 30s spot</title>
    <script src="assets/vendor/gsap/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/build/three.module.js", "three/addons/": "./assets/vendor/three/examples/jsm/" } }
    </script>
    <style>
      @font-face { font-family: "Michroma"; font-weight: 400; font-display: block; src: url("assets/fonts/Michroma-400.woff2") format("woff2"); }
      @font-face { font-family: "Newsreader"; font-style: italic; font-weight: 300; font-display: block; src: url("assets/fonts/Newsreader-300i.woff2") format("woff2"); }
      @font-face { font-family: "Newsreader"; font-style: italic; font-weight: 500; font-display: block; src: url("assets/fonts/Newsreader-500i.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 300; font-display: block; src: url("assets/fonts/IBMPlexMono-300.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: block; src: url("assets/fonts/BigShouldersDisplay-800.woff2") format("woff2"); }
      html, body { margin: 0; background: #000; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #font-warm { position: absolute; left: -9999px; }
      #font-warm .a { font: 400 20px Michroma; } #font-warm .b { font: italic 300 20px Newsreader; } #font-warm .c { font: italic 500 20px Newsreader; }
      #font-warm .d { font: 300 20px "IBM Plex Mono"; } #font-warm .e { font: 500 20px "IBM Plex Mono"; } #font-warm .f { font: 800 20px "Big Shoulders Display"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip layer" width="1920" height="1080" data-start="0" data-duration="30" data-track-index="1"></canvas>
      <audio id="song" src="assets/audio/track.mp3" data-start="0" data-media-start="52.9" data-duration="30" data-track-index="0"></audio>
      <div id="font-warm" aria-hidden="true" data-layout-allow-overflow><span class="a">N</span><span class="b">N</span><span class="c">N</span><span class="d">N</span><span class="e">N</span><span class="f">N</span></div>
    </div>
    <script>window.__timelines["main"] = gsap.timeline({ paused: true });</script>
    <script src="assets/song-data.js"></script>
    <script type="module">
      import { createNightPlus } from "./assets/nightplus.js";
      let draw = null;
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["nightplus"] = (async () => {
        await Promise.all(["400 40px Michroma", "italic 300 40px Newsreader", "italic 500 40px Newsreader", "300 20px 'IBM Plex Mono'", "500 20px 'IBM Plex Mono'", "800 40px 'Big Shoulders Display'"].map((f) => document.fonts.load(f)));
        const N = await createNightPlus({ canvas: document.getElementById("gl"), song: window.SONG, base: "./assets" });
        draw = (t) => N.render(t);
        draw(window.__hfThreeTime || 0);
      })();
      window.addEventListener("hf-seek", (e) => { if (draw) draw(e.detail.time); });
    </script>
  </body>
</html>
