<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Reel · intro</title>
    <script src="assets/vendor/gsap/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans SC"; font-weight: 400; font-display: block; src: url("assets/fonts/NotoSansSC-400-subset.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900; font-display: block; src: url("assets/fonts/NotoSansSC-900-subset.woff2") format("woff2"); }
      @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: block; src: url("assets/fonts/BigShouldersDisplay-800.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      @font-face { font-family: "Michroma"; font-weight: 400; font-display: block; src: url("assets/fonts/Michroma-400.woff2") format("woff2"); }
      @font-face { font-family: "Courier Prime"; font-weight: 700; font-display: block; src: url("assets/fonts/CourierPrime-700.woff2") format("woff2"); }
      html, body { margin: 0; background: #000; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #font-warm { position: absolute; left: -9999px; }
      #font-warm .a { font: 400 20px "Noto Sans SC"; } #font-warm .b { font: 900 20px "Noto Sans SC"; } #font-warm .c { font: 800 20px "Big Shoulders Display"; }
      #font-warm .d { font: 500 20px "IBM Plex Mono"; } #font-warm .e { font: 400 20px Michroma; } #font-warm .f { font: 700 20px "Courier Prime"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip layer" width="1920" height="1080" data-start="0" data-duration="10" data-track-index="1"></canvas>
      <audio id="song" src="assets/audio/track.mp3" data-start="0" data-media-start="42.9" data-duration="10" data-track-index="0"></audio>
      <div id="font-warm" aria-hidden="true" data-layout-allow-overflow><span class="a">同</span><span class="b">同</span><span class="c">N</span><span class="d">N</span><span class="e">N</span><span class="f">N</span></div>
    </div>
    <script>window.__timelines["main"] = gsap.timeline({ paused: true });</script>
    <script src="assets/song-data.js"></script>
    <script type="module">
      import { createReel } from "./assets/reel.js";
      let draw = null;
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["reel"] = (async () => {
        await Promise.all(["400 40px 'Noto Sans SC'", "900 40px 'Noto Sans SC'", "800 40px 'Big Shoulders Display'", "500 20px 'IBM Plex Mono'", "400 40px Michroma", "700 40px 'Courier Prime'"].map((f) => document.fonts.load(f, "同一批素材ABC")));
        const R = await createReel({ canvas: document.getElementById("gl"), song: window.SONG, base: "./assets", mode: "intro" });
        draw = (t) => R.render(t);
        draw(window.__hfThreeTime || 0);
      })();
      window.addEventListener("hf-seek", (e) => { if (draw) draw(e.detail.time); });
    </script>
  </body>
</html>
